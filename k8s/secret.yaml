apiVersion: v1
kind: Secret
metadata:
  name: middleware-secrets
type: Opaque
stringData:
  JWT_SECRET: "<your-jwt-secret>"
  SESSION_SECRET: "<your-session-secret>"
  BACKEND_API_KEY: "<your-backend-api-key>"
  # TLS cert/key if needed
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    …
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    …
    -----END PRIVATE KEY-----